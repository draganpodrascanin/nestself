name: nestself
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestself
      POSTGRES_PASSWORD: nestself_dev
      POSTGRES_DB: nestself
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the nestself_api login role (member of nestself_app) on first start.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestself -d nestself']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    profiles: [api]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: build }
    # Migrations run as the owner role (nestself); the API connects as nestself_api so RLS applies.
    command: ['pnpm', '--filter', '@nestself/api', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://nestself:nestself_dev@postgres:5432/nestself
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: [api]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [api.env]
    environment:
      DATABASE_URL: postgresql://nestself_api:nestself_api_dev@postgres:5432/nestself
      REDIS_URL: redis://redis:6379
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
  redisdata:
