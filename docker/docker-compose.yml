services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestself
      POSTGRES_PASSWORD: nestself_dev
      POSTGRES_DB: nestself
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestself -d nestself"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
