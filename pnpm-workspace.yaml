packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

catalog:
  # React (web and native must agree; react-native 0.88 requires ^19.3.0)
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # TypeScript and Node (5.9.x: typescript-eslint supports <6.1, @nestjs/swagger ^5.5||^6)
  typescript: 5.9.3
  "@types/node": 24.19.2
  tsx: 4.23.15
  # Bundlers and CSS
  vite: 8.3.4
  "@vitejs/plugin-react-swc": 4.3.3
  next: 16.4.2
  postcss: 8.5.31
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tailwindcss/postcss": 4.3.3
  # TanStack
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  "@tanstack/react-router-devtools": 1.167.2
  "@tanstack/react-query": 5.104.5
  "@tanstack/react-query-devtools": 5.104.5
  # UI
  "@base-ui/react": 1.9.0
  "@phosphor-icons/react": 2.1.10
  clsx: 2.1.1
  # Motion (formerly Framer Motion); presets in packages/ui/src/motion, rule in CLAUDE.md
  motion: 14.6.0
  tailwind-merge: 3.7.0
  # i18n
  i18next: 26.5.3
  react-i18next: 17.1.0
  i18next-browser-languagedetector: 8.2.1
  # Validation
  zod: 4.6.7
  # Testing
  vitest: 5.0.5
  jsdom: 30.1.3
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.8
  axe-core: 4.14.0
  "@playwright/test": 1.64.1
  "@axe-core/playwright": 4.14.0
  supertest: 7.3.1
  "@types/supertest": 7.2.1
  # Storybook
  storybook: 10.6.3
  "@storybook/react-vite": 10.6.3
  "@storybook/addon-a11y": 10.6.3
  # Lint and format (ESLint 9: jsx-a11y and react-refresh do not support 10 yet)
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.72.0
  eslint-config-next: 16.4.2
  eslint-config-prettier: 10.1.8
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  # Images
  sharp: 0.35.5
  # Expo SDK 58 / React Native
  expo: 58.0.16
  expo-router: 58.0.24
  expo-font: 58.0.9
  expo-image: 58.0.16
  expo-localization: 58.0.5
  expo-status-bar: 58.0.3
  expo-splash-screen: 58.0.10
  expo-system-ui: 58.0.6
  expo-constants: 58.0.12
  expo-linking: 58.0.13
  babel-preset-expo: 58.0.18
  react-native: 0.88.0
  react-native-screens: 4.30.0
  react-native-safe-area-context: 5.10.1
  react-native-svg: 15.16.0
  phosphor-react-native: 3.0.6
  "@react-native-async-storage/async-storage": 3.1.1
  # NestJS and Drizzle (drizzle-orm 1.0 is still a release candidate; 0.45.x is the stable line)
  "@nestjs/common": 12.2.0
  "@nestjs/core": 12.2.0
  "@nestjs/platform-express": 12.2.0
  "@nestjs/cli": 12.0.9
  "@nestjs/config": 12.0.1
  "@nestjs/swagger": 12.0.2
  "@nestjs/terminus": 12.1.0
  "@nestjs/throttler": 6.7.1
  "@nestjs/jwt": 12.0.3
  "@nestjs/testing": 12.2.0
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: 8.23.1
  "@types/pg": 8.23.1
  rxjs: 7.8.2
  reflect-metadata: 0.2.2
  helmet: 8.3.0
  dotenv: 18.0.8
  "@swc/core": 1.16.18
  "@swc/helpers": 0.5.23
  unplugin-swc: 2.0.0
  # Auth, infrastructure and jobs (added 2026-10-22; versions from npm view)
  aws-cdk-lib: 2.274.0
  constructs: 10.8.1
  cdk-nag: 3.0.2
  aws-cdk: 2.1146.0
  esbuild: 0.28.2
  "@types/aws-lambda": 8.10.164
  fast-check: 4.10.2
  aws-jwt-verify: 5.2.1
  "@aws-sdk/client-cognito-identity-provider": 3.1155.0
  "@aws-sdk/client-ses": 3.1155.0
  # Consultations and webinars (NS-CALLS-01); pinned to the same AWS SDK release line as the clients above
  "@aws-sdk/client-chime-sdk-meetings": 3.1155.0 # meetings, attendees, capabilities (D-CW-04, D-CW-32)
  "@aws-sdk/client-chime-sdk-media-pipelines": 3.1155.0 # webinar recording pipelines (D-CW-19, D-CW-34)
  "@aws-sdk/client-sqs": 3.1155.0 # Chime meeting event consumer (D-CW-12)
  amazon-chime-sdk-js: 3.32.0 # browser client in packages/video (D-CW-21)
  aws-sdk-client-mock: 4.1.0 # dev only: unit tests for the Chime adapter and the SQS consumer (OPS-31)
  react-native-webview: 14.0.1 # M4 mobile ticket route; Expo SDK 58 bundled version (D-CW-23)
  redis: 6.3.0
  ioredis: 6.0.0
  bullmq: 6.4.0
  ua-parser-js: 2.0.10
  "@types/ua-parser-js": 0.7.39
  socket.io: 4.8.4
  socket.io-client: 4.8.4 # web apps subscribe to call and webinar rooms (NS-CALLS-01, D-CW-16)
  "@nestjs/websockets": 12.2.0
  "@nestjs/platform-socket.io": 12.2.0
  cookie: 2.0.1
  qrcode: 1.5.4
  "@types/qrcode": 1.5.6
  expo-auth-session: 58.0.14
  expo-secure-store: 58.0.2
  expo-web-browser: 58.0.6
  expo-crypto: 58.0.7
  # Repo tooling
  turbo: 2.11.9
  sherif: 1.13.0
  next-mdx-remote: 6.0.0
  gray-matter: 4.0.3
  remark-gfm: 4.0.1
  rehype-slug: 6.0.0

# pnpm 10 blocks dependency build scripts unless allow-listed.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - unrs-resolver
  - "@parcel/watcher"
  - core-js
  - sharp
  - "@scarf/scarf"
