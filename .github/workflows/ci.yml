name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nestself
          POSTGRES_PASSWORD: nestself
          POSTGRES_DB: nestself_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nestself"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgresql://nestself:nestself@localhost:5432/nestself_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.10.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm lint:root
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

  cdk-nag-gate:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.10.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The certificate, zone and prefix list values are fixtures for the offline synth; the real ones come from CDK-setup.md section 8.
      - name: CDK synth (staging, offline)
        run: >-
          pnpm --filter @nestself/cdk exec cdk synth
          -c stage=staging
          -c account=000000000000
          -c platform=true
          -c authCertificateArn=arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
          -c hostedZoneId=Z0000000000000000000
          -c cloudfrontOriginPrefixListId=pl-00000000000000000
          --no-lookups
